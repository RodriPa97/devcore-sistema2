services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: devcore
      POSTGRES_USER: devcore
      POSTGRES_PASSWORD: devcore
    ports:
      - "5432:5432"
    volumes:
      - devcore-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcore -d devcore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devcore-postgres:

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://devcore:devcore@localhost:5432/devcore?schema=public
      NEXTAUTH_SECRET: ci-secret-that-is-long-enough-for-tests-and-build
      NEXTAUTH_URL: http://localhost:3000

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devcore
          POSTGRES_USER: devcore
          POSTGRES_PASSWORD: devcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devcore -d devcore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev
